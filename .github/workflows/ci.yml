name: CI

on:
  push:
    branches: [main, "agent/**", "hackathon/**"]
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install pytest pytest-asyncio requests pyyaml fastapi "uvicorn[standard]" httpx python-multipart cryptography python-telegram-bot playwright python-docx pypdf Pillow
      - run: python -m pytest tests -q --ignore=tests/test_founder_mode_live.py --ignore=tests/test_sovereign_e2e_live.py

  desktop-frontend:
    name: Desktop frontend (typecheck + build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: interfaces/desktop/package-lock.json }
      - working-directory: interfaces/desktop
        run: |
          npm ci
          npm run build

  rust-check:
    name: Rust check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: { runner: [ubuntu-22.04, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: interfaces/desktop/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "interfaces/desktop/src-tauri -> target" }
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev patchelf libxdo-dev
      - working-directory: interfaces/desktop
        run: |
          npm ci
          npm run build
      - working-directory: interfaces/desktop/src-tauri
        run: cargo check --locked

  stage-and-smoke:
    name: Bundled runtime smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: { runner: [ubuntu-22.04, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/stage_runtime.py --out "${{ runner.temp }}/sam-runtime"
      - run: python scripts/smoke_test_runtime.py "${{ runner.temp }}/sam-runtime"

  script-lint:
    name: Installer script syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in setup.sh setup_linux.sh scripts/*.sh; do bash -n "$f"; done
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S error scripts/install.sh scripts/uninstall_linux.sh scripts/macos_sign_runtime.sh
      - shell: pwsh
        run: |
          foreach ($f in 'setup_windows.ps1','scripts/install.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
