[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-assistant"
version = "2.1.2"
description = "SAM — Sovereign Autonomous Machine: Local-First Private AI Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Dhanush Surada", email = "dhanush@sam.local" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pyaudio>=0.2.14",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyautogui>=0.9.54",
    "playwright>=1.44.0",
    "Pillow>=10.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.0.0",
    "openwakeword>=0.6.0",
    "kokoro>=0.9.4",
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
sam = "interfaces.api.server:main"
sam-cli = "sam_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agent*", "memory*", "hands*", "mouth*", "ears*", "config*", "interfaces*", "sovereign*"]
