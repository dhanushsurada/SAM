[package]
name = "sam-desktop"
version = "0.1.0"
description = "SAM — native desktop shell (Agent 1: agent/desktop-product)"
authors = ["SAM"]
edition = "2021"

# NOTE (unverified): written by hand against documented Tauri v2 APIs. The
# sandbox this was authored in has no `cargo`/`rustc` and no macOS, so
# nothing in src-tauri/ has been compiled or run. Treat it the way this
# app's own react-shim.d.ts treats the TS side: a careful first draft, not
# a tested build. Run `cargo check` (from this directory) the moment this
# is on a real machine with Rust installed, before anything else — see
# NATIVE_SHELL_NOTES.md.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase C4: the models_list/model_select/model_pull bridge commands talk
# to the SAM API gateway over plain HTTP, per the Phase B design (reusing
# the gateway's existing REST/SSE surface rather than adding a second
# transport for operations that are only ever meaningful once it's
# already running).
reqwest = { version = "0.12", features = ["json", "stream"] }
# Parses the gateway's existing SSE framing (_format_sse in
# interfaces/api/server.py: "id: N\ndata: {...}\n\n") without hand-rolling
# a line-buffering parser for it.
eventsource-stream = "0.2"
# For .next() on the reqwest/eventsource stream in runtime.rs -- reqwest
# already depends on this internally; declared explicitly since its trait
# methods are called directly rather than only used transitively.
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "time"] }
# A second launch must focus the running app instead of starting a second backend.
tauri-plugin-single-instance = "2"

[[bin]]
name = "sam-desktop"
path = "src/main.rs"
