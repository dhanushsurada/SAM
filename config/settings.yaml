# SAM Settings — Edit this file to customise behaviour
# All values here override the defaults in config/settings.py

assistant_name: "SAM"
user_name: "Dhanush"

# Brain
ollama_host: "http://localhost:11434"
temperature: 0.7
max_tokens: 1024

# Ears
wake_word: "hey sam"
wake_word_threshold: 0.5
whisper_model: "base.en"
recording_timeout: 8.0

# Mouth
tts_engine: "kokoro"
kokoro_voice: "af_bella"
speech_rate: 1.0

# Vision
vision_model: "moondream"

# Memory
memory_top_k: 5
embedding_model: "nomic-embed-text"

# Founder Mode
founder_mode_enabled: true
# v2 — LLM auto-capture (Evidence + Confidence). Uncomment to override defaults.
# founder_mode_llm_capture: true
# founder_mode_classifier_model: "qwen2.5:7b"   # defaults to primary_model if unset
# founder_mode_min_confidence_to_show: 0.3

# Planning replacement. Run `local-jev serve` separately on localhost:8765.
# Set planning_backend to `legacy` for an immediate rollback. When JEV is
# unavailable or uncertain, SAM automatically falls back to the legacy planner.
planning_backend: "jev"
jev_base_url: "http://127.0.0.1:8765"
jev_model: "jev-latest"
jev_timeout_seconds: 2.0

# Phase 2 — Telegram bridge (internet-relay, not local-WiFi — see docs)
# telegram_bot_token: "123456:ABC-your-bot-token-from-BotFather"
# telegram_bot_username: "your_sam_bot"

# iQOO — Phone Task Gateway API server (interfaces/api/server.py)
# api_host: "0.0.0.0"
# api_port: 8420

# Runtime
incognito: false
log_level: "INFO"
